[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-densest-subgraph"
version = "1.0.0"
description = "Exact, greedy and spectral algorithms for the densest subgraph problem, benchmarked on 15 SNAP graphs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Davide Cinelli" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "networkx>=3.0"]

[project.scripts]
densest = "densest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
